<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ZB Idea Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: left rail on desktop, floating glass dock on phone; one reading column for ideas, a wide canvas for executive pages */
:root{
  --bg:#ffffff; --surface:#f4f7f5; --line:#e1e8e4; --ink:#0a0f0c; --ink-2:#26302b; --muted:#56655d;
  --green:#0d4a36; --green-hover:#093827; --tint:#e8f2ed; --tint-2:#cfe3d9; --heart:#c0352b;
  --glass:rgba(255,255,255,.74); --glass-line:rgba(13,74,54,.12); --scrim:rgba(10,15,12,.4);
  --f-display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--f-body);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .grow{flex:1;min-width:0} .min0{min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.code{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.01em}
.eyebrow{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--green);margin-bottom:6px}

/* shell */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;border-right:1px solid var(--line);padding:22px 14px 16px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 20px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.mark{width:30px;height:30px;border-radius:9px;background:var(--green);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.02em;flex:none}
.nav{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:500;width:100%}
.nav:hover{background:var(--surface);color:var(--ink)}
.nav.on{background:var(--tint);color:var(--green);font-weight:600}
.count{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--green);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.side-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:20px 12px 6px;font-weight:600}
.side .btn.primary{margin:12px 0 4px}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.me-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;width:100%}
.me-row:hover{background:var(--surface)}
.me-row small{display:block;color:var(--muted);font-size:12px}
.main{min-width:0;padding:32px 32px 120px}
.col{max-width:700px;margin:0 auto}
.wide{max-width:1080px;margin:0 auto}
.top,.dock{display:none}

/* buttons, inputs, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.btn:hover{background:var(--surface);border-color:var(--tint-2)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-hover)}
.btn.sm{height:34px;padding:0 13px;font-size:13px}
.btn.lg{height:48px;font-size:15px}
.btn.block{width:100%}
.btn.ghost{border-color:transparent}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--surface)}
.field{display:grid;gap:6px}
.field label,.lbl{font-size:13px;font-weight:600}
.inp{height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--bg);width:100%}
textarea.inp{height:auto;padding:12px 14px;min-height:92px;resize:vertical;line-height:1.55}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.inp:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--tint)}
.stack{display:grid;gap:16px}
.err{color:var(--heart);font-size:13.5px;font-weight:500}
.hint{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--tint);color:var(--green);font-size:12.5px;font-weight:600;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.ghost{background:var(--surface);color:var(--muted)}
.chip.ok{background:var(--green);color:#fff}
.chip.exec{background:var(--ink);color:#fff;font-size:11px;letter-spacing:.06em;text-transform:uppercase;height:22px}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.03em;white-space:nowrap;flex:none}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-idea{background:#edf1ef;color:#3e4c45}
.t-prototype{background:#fcf0d9;color:#8a5306}
.t-demo{background:#e5eefa;color:#1d4f91}
.t-pilot{background:#eee8f9;color:#5a3a99}
.t-launched{background:var(--green);color:#fff}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--bg);min-width:0}
.search:focus-within{border-color:var(--green);box-shadow:0 0 0 3px var(--tint)}
.search input{border:0;outline:0;background:none;width:100%;min-width:0;height:100%}
.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;flex:none;overflow:hidden;letter-spacing:.02em}
.av img{width:100%;height:100%;object-fit:cover}
.dot{width:3px;height:3px;border-radius:50%;background:var(--muted);flex:none;opacity:.6}

/* page heads + tabs */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.title{font-family:var(--f-display);font-size:36px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.sub{margin-top:8px;max-width:60ch}
.h-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.h-tools .search{width:260px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:2px;overflow-x:auto}
.tab{padding:11px 2px;margin-right:22px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--green)}
.tab:hover{color:var(--ink)}
.fchips{display:flex;gap:6px;flex-wrap:wrap;padding-top:14px}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:18px;margin-bottom:4px}
.sample{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px dashed var(--tint-2);border-radius:999px;padding:3px 10px}

/* challenge strip */
.strip-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
.strip-h button{color:var(--green);font-weight:600}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;margin-bottom:22px;scroll-snap-type:x mandatory}
.ch-card{flex:0 0 268px;scroll-snap-align:start;border:1px solid var(--tint-2);border-radius:16px;padding:14px 16px;background:linear-gradient(160deg,var(--tint),var(--bg) 70%);display:flex;flex-direction:column;gap:8px}
.ch-card:hover{border-color:var(--green)}
.ch-card h3{font-family:var(--f-display);font-size:16px;font-weight:650;line-height:1.25;letter-spacing:-.01em}
.ch-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:auto}

/* idea card */
.card{display:block;padding:22px 0;border-bottom:1px solid var(--line);cursor:pointer}
.card:hover .card-title{color:var(--green)}
.why{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--green);margin-bottom:10px}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.meta b{color:var(--ink);font-weight:600;white-space:nowrap}
.plink{display:inline-flex;align-items:center;gap:8px;min-width:0}
.plink:hover b{text-decoration:underline}
.plink b{overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:520px){.card .meta .dept,.card .meta .dept+.dot{display:none}}
.card-title{font-family:var(--f-display);font-size:21px;font-weight:650;letter-spacing:-.018em;line-height:1.25;margin:12px 0 6px;text-wrap:balance;transition:color .15s}
.card-sum{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:65ch}
.card-foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.card-foot:empty{display:none}
.acts{display:flex;align-items:center;gap:2px;margin-top:10px;margin-left:-10px}
.act{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:999px;color:var(--muted);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.act:hover{background:var(--surface);color:var(--ink)}
.act.liked{color:var(--heart)}
.act.saved{color:var(--green)}
.act.push{margin-left:auto}
.act.liked svg{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.3)}}

/* idea page */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:600;margin-bottom:20px;margin-left:-4px}
.back:hover{color:var(--ink)}
.i-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.i-title{font-family:var(--f-display);font-size:clamp(29px,5vw,42px);line-height:1.06;letter-spacing:-.032em;font-weight:700;margin:16px 0 14px;text-wrap:balance}
.lede{font-size:19px;line-height:1.55;color:var(--ink-2);margin-bottom:24px;max-width:62ch}
.author{display:flex;align-items:center;gap:12px;padding:14px 0;border-block:1px solid var(--line)}
.author b{display:block}
.author small{display:block;color:var(--muted);font-size:13px}
.life{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:24px 0 26px}
.life span{display:block;height:4px;border-radius:4px;background:var(--line)}
.life .done span{background:var(--green)}
.life small{display:block;font-size:11.5px;color:var(--muted);margin-top:7px}
.life .cur small{color:var(--ink);font-weight:700}
.ch-banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--tint);margin-bottom:26px;width:100%}
.ch-banner small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.ch-banner b{font-family:var(--f-display);font-weight:650}
.prose p{font-size:17px;line-height:1.75;margin:0 0 1.1em;max-width:65ch;color:var(--ink-2)}
.section-h{font-family:var(--f-display);font-size:19px;font-weight:650;letter-spacing:-.01em;margin:36px 0 12px}
.docs{display:grid;gap:8px}
.doc{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border:1px solid var(--line);border-radius:12px;width:100%}
.doc:hover{border-color:var(--tint-2);background:var(--surface)}
.doc b{display:block;font-weight:600;font-size:14px}
.ext{width:38px;height:44px;border-radius:6px 12px 6px 6px;display:grid;place-items:center;font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:#fff;flex:none;letter-spacing:.04em}
.e-pdf{background:#b23a2e}.e-xlsx{background:#1f6f45}.e-pptx{background:#c4581f}.e-docx{background:#2b5797}.e-other{background:#56655d}
.big-acts{border-block:1px solid var(--line);padding:4px 0;margin-top:30px}
.big-acts .acts{margin:0}
.exec{border:1px solid var(--tint-2);background:var(--tint);border-radius:18px;padding:18px;margin-top:24px}
.exec-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.exec-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.exec .inp{height:36px;width:auto;font-size:13px;background-color:var(--bg)}
.composer{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.composer .right{display:flex;justify-content:flex-end;margin-top:8px}
.cm{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.cm .meta{margin-bottom:4px}
.cm p{color:var(--ink-2);max-width:65ch}

/* profile */
.banner{height:136px;border-radius:20px;background:radial-gradient(rgba(255,255,255,.14) 1.2px,transparent 1.3px) 0 0/14px 14px,linear-gradient(120deg,var(--green),#1d6b51)}
.p-head{display:flex;justify-content:space-between;align-items:flex-end;padding:0 4px;margin-top:-46px}
.p-av{position:relative}
.p-av .av{border:4px solid var(--bg);box-sizing:content-box}
.cam{position:absolute;right:2px;bottom:4px;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;cursor:pointer;border:2px solid var(--bg)}
.p-btns{display:flex;gap:8px;padding-bottom:6px}
.p-name{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:-.025em;margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.p-sub{color:var(--ink-2);font-weight:500;margin-top:2px}
.p-bio{margin-top:12px;max-width:62ch;color:var(--ink-2)}
.p-stats{display:flex;gap:22px;flex-wrap:wrap;margin:16px 0 22px;font-size:14px;color:var(--muted)}
.p-stats b{color:var(--ink);font-variant-numeric:tabular-nums;margin-right:4px}

/* members */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:18px}
.mcard{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;width:100%}
.mcard:hover{border-color:var(--tint-2);background:var(--surface)}
.mcard b{display:block}
.mcard small{display:block;color:var(--muted);font-size:12.5px}

/* chat */
.chat{display:grid;grid-template-columns:300px minmax(0,1fr);border:1px solid var(--line);border-radius:20px;height:calc(100dvh - 160px);min-height:420px;overflow:hidden}
.clist{border-right:1px solid var(--line);overflow-y:auto;padding:8px}
.citem{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;width:100%}
.citem:hover{background:var(--surface)}
.citem.on{background:var(--tint)}
.citem .row{display:flex;justify-content:space-between;gap:8px}
.citem small{color:var(--muted);font-size:12px;flex:none}
.citem .trunc{display:block;font-size:13px;color:var(--muted)}
.thread{display:flex;flex-direction:column;min-width:0;min-height:0}
.th-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.th-head small{display:block;color:var(--muted);font-size:12px}
.msgs{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(var(--bg),var(--surface))}
.bub{max-width:75%;padding:9px 13px;border-radius:16px 16px 16px 4px;background:var(--bg);border:1px solid var(--line);overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--green);color:#fff;border-color:var(--green);border-radius:16px 16px 4px 16px}
.bub small{display:block;font-size:10.5px;opacity:.7;margin-top:2px}
.th-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.th-form .inp{border-radius:999px}
.mob-only{display:none}

/* activity */
.note{display:flex;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
.n-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--green);flex:none;position:relative}
.n-ic.hot{background:var(--green);color:#fff}
.n-ic.like{color:var(--heart)}
.unread::after{content:"";position:absolute;top:0;right:0;width:10px;height:10px;border-radius:50%;background:var(--heart);border:2px solid var(--bg)}
.note p{color:var(--ink-2)}
.note p b{color:var(--ink)}
.note .when{font-size:12.5px;color:var(--muted);margin-top:2px}
.mailcard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px;background:var(--surface)}
.mail-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.mailcard .subj{font-weight:700;margin-bottom:6px}
.mailcard .body{white-space:pre-wrap;color:var(--ink-2);font-size:14px}
.reply{display:flex;gap:8px;margin-top:12px}
.reply .inp{background:var(--bg)}
.replied{margin-top:12px;font-size:13.5px;color:var(--green);font-weight:600;display:flex;gap:6px;align-items:flex-start}

/* challenges */
.chl{display:grid;gap:14px}
.chx{border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:10px}
.chx h2{font-family:var(--f-display);font-size:22px;font-weight:650;letter-spacing:-.02em;line-height:1.2}
.chx .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kw{font-family:var(--f-mono);font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--surface);color:var(--muted)}
.closes{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.closes b{color:var(--ink)}

/* executive */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.kpi .n{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi.lead{background:var(--green);border-color:var(--green);color:#fff}
.kpi.lead .l{color:rgba(255,255,255,.75)}
.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.panel{border:1px solid var(--line);border-radius:20px;padding:18px 20px;min-width:0}
.panel h3{font-family:var(--f-display);font-size:16px;font-weight:650;margin-bottom:14px}
.hb{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13px;margin-bottom:9px}
.hb .track{height:10px;border-radius:5px;background:var(--surface);overflow:hidden}
.hb .fill{height:100%;border-radius:5px;background:var(--green)}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.pipe{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;margin-bottom:14px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums;padding-right:6px}
.lc{list-style:none;margin:0;padding:0}

/* ---------- ranking model (stand-in formula) ---------- */
const text=i=>(i.title+' '+i.summary+' '+i.body.join(' ')).toLowerCase();
function relevance(i,ch){
  if(!ch){const own=i.challenge&&CH[i.challenge];return own?relevance(i,own):35}
  const t=text(i),hits=ch.keywords.filter(k=>t.includes(k)).length;
  let r=hits/ch.keywords.length*100; if(i.challenge===ch.id) r=r*.7+30;
  return Math.min(100,Math.round(r));
}
const rawEng=x=>x.likes+3*x.comments.length+2*x.shares;
function engagement(i,pool){const m=Math.max(1,...pool.map(rawEng));return Math.round(rawEng(i)/m*100)}
function quality(i){const w=i.body.join(' ').split(/\s+/).length;return Math.min(100,Math.round(Math.min(45,w/4)+Math.min(30,i.docs.length*13)+STATUSES.indexOf(i.status)*6))}
function scoreAll(chId){
  const ch=CH[chId]||null, w=S.rank.w, tw=(w.rel+w.eng+w.q)||1;
  let pool=ch?IDEAS.filter(i=>i.challenge===chId||relevance(i,ch)>=45):IDEAS.slice();
  return pool.map(i=>{const rel=relevance(i,ch),eng=engagement(i,IDEAS),q=quality(i);
    return {i,rel,eng,q,total:Math.round((w.rel*rel+w.eng*eng+w.q*q)/tw),outside:ch&&i.challenge!==chId}}).sort((a,b)=>b.total-a.total);
}

function vMembers(){

function memberCards(){

/* ---------- activity ---------- */
function vActivity(){
  const list=NOTES.slice().sort((a,b)=>b.at-a.at);
  return `<div class="col"><div class="page-h"><div><h1 class="title">Activity</h1><p class="sub muted">Likes, comments, approvals and new challenges.</p></div></div>
   ${list.length?list.map(note).join(''):`<div class="empty"><b>Nothing yet</b></div>`}</div>`;
}
function note(n){
  const f=U[n.from],i=n.idea&&I(n.idea);
  const ic={like:['heart','like'],comment:['comment',''],approval:['check','hot'],challenge:['flag','']}[n.type];
  let txt='';
  if(n.type==='like') txt=`<b>${esc(f.name)}</b> liked your idea <b>${esc(i.title)}</b>`;
  if(n.type==='comment') txt=`<b>${esc(f.name)}</b> commented on <b>${esc(i.title)}</b>`;
  if(n.type==='challenge') txt=`<b>${esc(f.name)}</b> posted a new challenge: <b>${esc(CH[n.challenge].title)}</b>`;
  if(n.type==='approval') txt=`<b>${esc(f.name)}</b> approved your idea <b>${esc(i.title)}</b>. We emailed you as well.`;
  const target=n.type==='challenge'?`data-r="challenge" data-id="${n.challenge}"`:`data-r="idea" data-id="${n.idea}"`;
  let extra='';
  if(n.type==='approval'){
    extra=`<div class="mailcard"><div class="mail-h">${icon('mail',14)} To ${esc(ME().email)} · from ${esc(f.email)}</div><div class="subj">Your idea ${code(i)} has been approved</div><div class="body">${esc(n.note||'No note added.')}</div>
     ${n.reply?`<div class="replied">${icon('check',15)} You replied: ${esc(n.reply)}</div>`:`<form class="reply" data-f="reply" data-id="${n.id}"><label class="sr" for="rp-${n.id}">Reply</label><input class="inp" id="rp-${n.id}" name="t" placeholder="Reply to ${esc(first(f))}" required><button class="btn primary">Reply</button></form>`}</div>`;
  }
  return `<div class="note"><span class="n-ic ${ic[1]} ${n.fresh?'unread':''}">${icon(ic[0],18,n.type==='like')}</span><div class="grow"><button data-a="go" ${target} style="text-align:left"><p>${txt}</p></button><div class="when">${ago(n.at)}</div>${extra}</div></div>`;
}

/* ---------- challenges ---------- */
function vChallenges(){

}
function chBlock(c){
  const n=IDEAS.filter(i=>i.challenge===c.id).length,days=Math.max(0,Math.ceil((c.deadline-Date.now())/D));
  return `<article class="chx"><div class="row"><span class="eyebrow" style="margin:0">${icon('flag',12)} Challenge</span><span class="grow"></span><span class="closes">Closes <b>${fmtShort(c.deadline)}</b> · ${days} days left</span></div>
   <h2>${esc(c.title)}</h2><p class="muted">${esc(c.brief)}</p>
   <div class="row">${c.keywords.map(k=>`<span class="kw">${esc(k)}</span>`).join('')}</div>
   <div class="row" style="margin-top:4px"><span class="meta">${plink(U[c.by],24)}<span class="dot"></span>${plural(n,'idea')}</span><span class="grow"></span><button class="btn sm" data-a="go" data-r="challenge" data-id="${c.id}">View ideas</button><button class="btn primary sm" data-a="new" data-id="${c.id}">${icon('plus',15)} Submit idea</button></div></article>`;
}
function vChallenge(id){
  const c=CH[id]; if(!c) return `<div class="col empty"><b>Challenge not found</b></div>`;
  const list=scoreAll(id).filter(x=>x.i.challenge===id).map(x=>x.i);
  return `<div class="col"><button class="back desk" data-a="back">${icon('back',18)} Back</button>${chBlock(c)}
   <h3 class="section-h">Ideas submitted (${list.length})</h3>${list.length?list.map(i=>card(i)).join(''):`<div class="empty"><b>No ideas yet</b>Be the first to answer this challenge.</div>`}</div>`;
}

/* ---------- executive: insights ---------- */
function vInsights(){

  const byDept={};IDEAS.forEach(i=>{const d=U[i.author].dept;byDept[d]=(byDept[d]||0)+1});
  const depts=Object.entries(byDept).sort((a,b)=>b[1]-a[1]),dm=Math.max(...depts.map(d=>d[1]));
  const st=STATUSES.map(s=>[s,IDEAS.filter(i=>i.status===s).length]);
  const sc={Idea:'#b9c6bf',Prototype:'#d99a2b',Demo:'#3d74c0',Pilot:'#7a5bbd',Launched:'#0d4a36'};
  const people=Object.values(U).map(u=>{const m=IDEAS.filter(i=>i.author===u.id);return {u,n:m.length,l:m.reduce((s,i)=>s+i.likes,0)}}).filter(x=>x.n).sort((a,b)=>b.n-a.n||b.l-a.l).slice(0,5);

   <div class="panels">
    <div class="panel"><h3>Ideas by department</h3>${depts.map(([d,n])=>`<div class="hb"><span class="trunc">${esc(d)}</span><span class="track"><span class="fill" style="display:block;width:${n/dm*100}%"></span></span><span class="v">${n}</span></div>`).join('')}</div>
    <div class="panel"><h3>Where ideas are in the pipeline</h3><div class="pipe">${st.filter(s=>s[1]).map(([s,n])=>`<span style="width:${n/tot*100}%;background:${sc[s]}" title="${s}: ${n}"></span>`).join('')}</div><div class="legend">${st.map(([s,n])=>`<div><span style="width:10px;height:10px;border-radius:3px;background:${sc[s]};flex:none"></span>${s}<b>${n}</b></div>`).join('')}</div></div>
    <div class="panel"><h3>Challenge response</h3>${chs.map(([c,n])=>`<div class="hb"><span class="trunc" title="${esc(c.title)}">${esc(c.title)}</span><span class="track"><span class="fill" style="display:block;width:${n/cm*100}%"></span></span><span class="v">${n}</span></div>`).join('')}<p class="hint" style="margin-top:8px">Ideas submitted under each open challenge.</p></div>
    <div class="panel"><h3>Top contributors</h3><ul class="lc">${people.map(p=>`<li>${plink(p.u,28)}<span class="num">${plural(p.n,'idea')} · ${p.l} likes</span></li>`).join('')}</ul></div>

/* ---------- executive: AI ranking ---------- */
function vRanking(){
  const w=S.rank.w;
  const sl=(k,l)=>`<div class="wt"><label for="w-${k}"><span>${l}</span><output id="o-${k}">${w[k]}</output></label><input id="w-${k}" type="range" min="0" max="100" step="5" value="${w[k]}" data-in="w" data-k="${k}"></div>`;
  return `<div class="wide"><div class="page-h"><div><div class="eyebrow">${icon('spark',13)} ZB Idea Ranker</div><h1 class="title">AI ranking</h1><p class="sub muted">Every idea is scored on how well it fits what you asked for, how colleagues responded, and the quality of the idea itself. The top five come first.</p></div>
   <button class="btn primary sm" data-a="digest">${icon('mail',15)} Email me the top 5</button></div>
   <div class="rank-ctl"><div class="field"><label for="rk-ch">Rank against</label><select class="inp" id="rk-ch" data-in="rankCh"><option value="all" ${S.rank.ch==='all'?'selected':''}>All ideas</option>${Object.values(CH).map(c=>`<option value="${c.id}" ${S.rank.ch===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div>
    <div class="weights">${sl('rel','Fits what we asked')}${sl('eng','Likes and comments')}${sl('q','Idea quality')}</div></div>
   <p class="sim">${icon('shield',14)} Prototype: a weighted formula stands in for the trained model, so you can see how ranking will behave.</p>
   <div id="rank-list">${rankList()}</div></div>`;
}
function rankList(){
  const list=scoreAll(S.rank.ch);
  if(!list.length) return `<div class="empty"><b>No ideas to rank yet</b></div>`;
  const row=(x,n,top)=>{const u=U[x.i.author];return `<div class="rk ${top?'top':''}"><div class="rk-n">${n}</div><div class="min0"><div class="meta">${plink(u,24)}<span class="dot"></span><span class="trunc">${esc(u.dept)}</span>${tag(x.i.status)}</div>
   <button class="rk-title" data-a="go" data-r="idea" data-id="${x.i.id}">${esc(x.i.title)}</button>
   <div class="bars">${mb('Fits what we asked',x.rel)}${mb('Likes and comments',x.eng)}${mb('Idea quality',x.q)}</div>${x.outside?`<div style="margin-top:10px"><span class="chip ghost">Matched from outside this challenge</span></div>`:''}</div>
   <div class="rk-side"><div class="score">${x.total}<small>/100</small></div>${x.i.approved?`<span class="chip ok">${icon('check',13)} Approved</span>`:`<button class="btn primary sm" data-a="approve" data-id="${x.i.id}">${icon('check',15)} Approve</button>`}</div></div>`};
  return `<div class="rkl">${list.slice(0,5).map((x,n)=>row(x,n+1,true)).join('')}</div>${list.length>5?`<h3 class="section-h">Also ranked</h3><div class="rkl">${list.slice(5).map((x,n)=>row(x,n+6,false)).join('')}</div>`:''}`;
}

      <div class="field"><label for="ni-c">Challenge</label><select class="inp" id="ni-c" name="challenge"><option value="">Not linked to a challenge</option>${Object.values(CH).map(c=>`<option value="${c.id}" ${m.challenge===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div></div>
     <div class="field"><label for="ni-sum">Summary</label><textarea class="inp" id="ni-sum" name="summary" rows="2" maxlength="240" placeholder="Two sentences. What is the idea and who does it help?"></textarea></div>
     <div class="field"><label for="ni-b">Full description</label><textarea class="inp" id="ni-b" name="body" rows="7" placeholder="The problem, how your idea works, what you have tested, and what you need. Leave a blank line between paragraphs."></textarea></div>
     <div class="field"><span class="lbl">Supporting documents</span><label class="drop" for="ni-f">${icon('clip',18)} Attach PDFs, spreadsheets or slides<input class="sr" type="file" id="ni-f" multiple data-in="docs"></label><div class="dlist" id="draft-docs">${draftDocs()}</div></div>
     <p class="err" id="ni-err" role="alert"></p>
     <div class="sheet-f"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn primary">Post idea</button></div></form>`;
  }
  if(m.type==='filter'){
    h='Filter ideas';
    b=`<div class="stack"><div class="field"><span class="lbl">Stage</span><div class="schips">${STATUSES.map(s=>`<button class="schip ${S.filter.statuses.includes(s)?'on':''}" data-a="fstatus" data-v="${s}" aria-pressed="${S.filter.statuses.includes(s)}">${s}</button>`).join('')}</div></div>
     <div class="field"><label for="f-ch">Challenge</label><select class="inp" id="f-ch" data-in="fch"><option value="all">All ideas</option>${Object.values(CH).map(c=>`<option value="${c.id}" ${S.filter.challenge===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div>
     <div class="sheet-f"><button class="btn" data-a="fclear">Clear</button><button class="btn primary" data-a="fapply">Show ideas</button></div></div>`;
  }
  if(m.type==='approve'){
    const i=I(m.id),u=U[i.author];h='Approve this idea';
    b=`<form class="stack" data-f="approve" data-id="${i.id}"><div class="ch-banner" style="margin:0">${icon('spark',20)}<span><small>${code(i)}</small><b>${esc(i.title)}</b></span></div>
     <p class="muted">${esc(u.name)} will get an email at <span class="code">${esc(u.email)}</span> straight away, and can reply to you.</p>
     <div class="field"><label for="ap-n">Note to ${esc(first(u))} (optional)</label><textarea class="inp" id="ap-n" name="note" rows="3" placeholder="What happens next, who to talk to" autofocus></textarea></div>
     <div class="sheet-f"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn primary">${icon('check',16)} Approve and email</button></div></form>`;
  }
  if(m.type==='doc'){
    const i=I(m.id),d=i.docs[m.idx];h='Document';
    b=`<div class="stack"><div style="display:flex;gap:14px;align-items:center">${ext(d.n)}<div class="min0"><b class="trunc" style="display:block">${esc(d.n)}</b><span class="hint">${esc(d.s)} · attached to ${code(i)} by ${esc(U[i.author].name)}</span></div></div>
     <p class="muted">The document viewer opens here in the full build. This prototype keeps file names only, not file contents.</p><div class="sheet-f"><button class="btn primary" data-a="close">Done</button></div></div>`;
  }
  if(m.type==='edit'){
    h='Edit profile';
    b=`<form class="stack" data-f="edit"><div style="display:flex;align-items:center;gap:14px">${av(me,64)}<label class="btn sm" for="ed-ph">${icon('camera',15)} Change photo<input class="sr" type="file" id="ed-ph" accept="image/*" data-in="photo"></label></div>
     <div class="field"><label for="ed-n">Full name</label><input class="inp" id="ed-n" name="name" value="${esc(me.name)}" required></div>
     <div class="two"><div class="field"><label for="ed-t">Job title</label><input class="inp" id="ed-t" name="title" value="${esc(me.title)}"></div><div class="field"><label for="ed-d">Department</label><input class="inp" id="ed-d" name="dept" value="${esc(me.dept)}"></div></div>
     <div class="field"><label for="ed-b">What you do at ZB</label><textarea class="inp" id="ed-b" name="bio" rows="3">${esc(me.bio)}</textarea></div>
     <div class="sheet-f"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn primary">Save profile</button></div></form>`;
  }
  if(m.type==='newChallenge'){
    h='Post a challenge';
    const dd=new Date(Date.now()+30*D).toISOString().slice(0,10);
    b=`<form class="stack" data-f="newChallenge"><div class="field"><label for="nc-t">What do you want ideas for?</label><input class="inp" id="nc-t" name="title" placeholder="For example: Fewer failed mobile money transfers" autofocus required></div>
     <div class="field"><label for="nc-b">Brief</label><textarea class="inp" id="nc-b" name="brief" rows="3" placeholder="The problem, why it matters now, and what a good answer looks like" required></textarea></div>
     <div class="two"><div class="field"><label for="nc-k">Keywords for AI ranking</label><input class="inp" id="nc-k" name="kw" placeholder="transfer, mobile, failed"></div><div class="field"><label for="nc-d">Closes on</label><input class="inp" id="nc-d" name="deadline" type="date" value="${dd}"></div></div>
     <p class="hint">Every verified employee sees the challenge on their home page and in Activity.</p>
     <div class="sheet-f"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn primary">Post challenge</button></div></form>`;
  }
  if(m.type==='newChat'){
    h='New chat';
    b=`<div class="menu">${Object.values(U).filter(u=>u.id!=='me').map(u=>`<button class="mcard" style="border:0" data-a="startChat" data-id="${u.id}">${av(u,40)}<span class="min0"><b>${esc(u.name)}</b><small>${esc(u.title)} · ${esc(u.dept)}</small></span></button>`).join('')}</div>`;
  }
  if(m.type==='sheet'){
    h='Menu';
    const lk=(r,l,ic,id)=>`<button class="nav" data-a="go" data-r="${r}" ${id?`data-id="${id}"`:''}>${icon(ic)}${l}</button>`;
    b=`<div class="menu"><button class="me-row" data-a="go" data-r="profile" data-id="me">${av(me,44)}<span class="min0"><b style="display:block">${esc(me.name)}</b><small>${esc(me.email)}</small></span></button>
     ${lk('profile','My profile','user','me')}${lk('challenges','Challenges','flag')}
     ${me.isAdmin?`<div class="side-label">Executive</div>${lk('insights','Insights','chart')}${lk('ranking','AI ranking','spark')}${lk('users','All users','users')}${lk('emails','Email log','mail')}`:''}
     <div class="side-label">Account</div><button class="nav" data-a="switchRole">${icon('swap')} Switch to ${me.isAdmin?'employee':'admin'} view (demo)</button><button class="nav" data-a="signout">${icon('logout')} Sign out</button></div>`;
  }
  mr.innerHTML=`<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mh"><div class="sheet-h"><h2 id="mh">${h}</h2>${x}</div>${b}</div></div>`;
}
const draftDocs=()=>S.draftDocs.map((d,n)=>`<div>${icon('file',15)}<span class="trunc grow">${esc(d.n)}</span><span class="hint">${d.s}</span><button type="button" class="iconbtn" style="width:28px;height:28px" data-a="rmDoc" data-v="${n}" aria-label="Remove">${icon('x',14)}</button></div>`).join('');
const size=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';

let tt;
function toast(t){$('#toast-root').innerHTML=`<div class="toast" role="status">${icon('check',17)}<span>${esc(t)}</span></div>`;clearTimeout(tt);tt=setTimeout(()=>{$('#toast-root').innerHTML=''},3200)}

/* ---------- actions ---------- */
function addEmail(e){e.id='e'+(ESEQ++);e.at=Date.now();EMAILS.unshift(e);return e}
function approve(id,noteTxt){
  const i=I(id),me=ME(),u=U[i.author];
  i.approved=true;i.approvedBy='me';i.approvedAt=Date.now();
  addEmail({type:'Approval',to:u.email,from:me.email,subject:`Your idea ${code(i)} has been approved`,body:`Hi ${first(u)},\n\n${me.name} approved your idea "${i.title}" on ZB Idea Manager.\n\n${noteTxt?'Note from the reviewer:\n'+noteTxt+'\n\n':''}Reply to this email or from your Activity page.\n\nZB Idea Manager`});
  if(i.author==='me') NOTES.unshift({id:'n'+(NSEQ++),type:'approval',idea:i.id,from:'me',at:Date.now(),unread:true,note:noteTxt});
  toast(`Approved. Email sent to ${u.email}`);
}
function digest(){
  const ch=CH[S.rank.ch],list=scoreAll(S.rank.ch).slice(0,5),me=ME();
  addEmail({type:'Digest',to:me.email,from:'ranker@ideas.zb.co.zw',subject:`Top 5 ideas: ${ch?ch.title:'All ideas'}`,body:`Hi ${first(me)},\n\nThese are the five highest ranked ideas right now. Open ZB Idea Manager to read them in full.\n\n${list.map((x,n)=>`${n+1}. ${x.i.title} (${x.total}/100) by ${U[x.i.author].name}`).join('\n')}\n\nZB Idea Ranker`});
  toast('Top 5 sent to '+me.email);
}
function startChat(uid){
  let c=CONVS.find(k=>k.with===uid);
  if(!c){c={id:'k'+Date.now(),with:uid,msgs:[]};CONVS.push(c)}
  S.chatOpen=c.id; if(!c.msgs.length) c.msgs.push({from:'me',t:'Hi '+first(U[uid])+'!',at:Date.now()});
  go('chat');S.chatOpen=c.id;render();
}
function signIn(){
  const local=S.email.split('@')[0],name=local.split(/[._-]/).filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join(' ')||'ZB Employee';
  U.me={id:'me',name,title:S.role==='admin'?'Executive, Digital Strategy':'Business Analyst',dept:'Digital Banking',bio:'I like ideas that save a customer a trip to the branch.',joined:'2023',isAdmin:S.role==='admin',c:COLORS[0],email:S.email.toLowerCase(),img:null};
  if(!EMAILS.length){const e=addEmail({type:'Approval',to:U.me.email,from:U.u6.email,subject:'Your idea ZB-IDEA-0132 has been approved',body:`Hi ${first(U.me)},\n\nTapiwa Dube approved your idea "Payday cash forecasting from payroll calendars" on ZB Idea Manager.\n\nNote from the reviewer:\n${NOTES[0].note}\n\nReply to this email or from your Activity page.\n\nZB Idea Manager`});e.at=NOW-3*D}
  S.authed=true;S.err='';S.route={name:S.role==='admin'?'ranking':'home'};S.stack=[];render();window.scrollTo(0,0);
  toast(`Verified as ZB staff. Welcome, ${first(U.me)}.`);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]'); if(!t) return;
  const a=t.dataset.a,id=t.dataset.id;
  if(a==='scrim'){if(e.target===t)closeModal();return}
  e.stopPropagation();
  switch(a){
    case 'go': if(t.dataset.hash)S.scrollTo=t.dataset.hash; go(t.dataset.r,id); break;
    case 'back': back(); break;
    case 'like':{const i=I(id);i.liked=!i.liked;i.likes+=i.liked?1:-1;render();break}
    case 'save':{const i=I(id);i.saved=!i.saved;render();toast(i.saved?'Saved to your profile':'Removed from saved');break}
    case 'share':{const i=I(id);i.shares++;const txt=`${code(i)}: ${i.title}`;try{navigator.clipboard.writeText(txt).catch(()=>{})}catch(_){}render();toast('Link to '+code(i)+' copied');break}
    case 'tab': S.feedTab=t.dataset.v; render(); break;
    case 'ptab': S.ptab=t.dataset.v; render(); break;
    case 'filter': if(S.route.name!=='home')go('home'); openModal({type:'filter'}); break;
    case 'fstatus':{const v=t.dataset.v,s=S.filter.statuses;S.filter.statuses=s.includes(v)?s.filter(x=>x!==v):s.concat(v);renderModal();render();break}
    case 'fclear': S.filter={statuses:[],challenge:'all'}; if(S.modal)renderModal(); render(); break;
    case 'fapply': closeModal(); render(); break;
    case 'searchToggle': if(S.route.name!=='home')go('home'); S.searchOpen=!S.searchOpen; render(); {const q=$('#qm');if(q)q.focus()} break;
    case 'sheet': openModal({type:'sheet'}); break;
    case 'new': S.draftDocs=[]; openModal({type:'newIdea',challenge:id||''}); break;
    case 'close': closeModal(); break;
    case 'doc': openModal({type:'doc',id,idx:+t.dataset.idx}); break;
    case 'approve': openModal({type:'approve',id}); break;
    case 'digest': digest(); break;
    case 'openChat': S.chatOpen=id; render(); {const f=$('.th-form .inp');if(f&&window.innerWidth>899)f.focus()} break;
    case 'closeChat': S.chatOpen=null; render(); break;
    case 'newChat': openModal({type:'newChat'}); break;
    case 'startChat': closeModal(true); startChat(id); break;
    case 'editProfile': openModal({type:'edit'}); break;
    case 'newChallenge': openModal({type:'newChallenge'}); break;
    case 'rmDoc': S.draftDocs.splice(+t.dataset.v,1); $('#draft-docs').innerHTML=draftDocs(); break;
    case 'mail': S.openMail=S.openMail===id?null:id; render(); break;
    case 'role': S.role=t.dataset.v; render(); break;
    case 'loginBack': S.step='creds'; S.err=''; render(); break;
    case 'switchRole':{const me=ME();me.isAdmin=!me.isAdmin;me.title=me.isAdmin?'Executive, Digital Strategy':'Business Analyst';closeModal(true);if(['insights','ranking','users','emails'].includes(S.route.name)&&!me.isAdmin)S.route={name:'home'};render();toast(me.isAdmin?'Executive admin view on':'Employee view on');break}
    case 'signout': closeModal(true); S.authed=false; S.step='creds'; S.err=''; render(); break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.modal) closeModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-a][tabindex]')){e.preventDefault();e.target.click()}
});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset.in; if(!k) return;
  if(k==='search'){S.search=t.value;const f=$('#feed');if(f)f.innerHTML=feedList()}
  if(k==='mq'){S.memberQ=t.value;$('#mgrid').innerHTML=memberCards()}
  if(k==='uq'){S.userQ=t.value;$('#ubody').innerHTML=userRows()}
  if(k==='w'){S.rank.w[t.dataset.k]=+t.value;$('#o-'+t.dataset.k).textContent=t.value;$('#rank-list').innerHTML=rankList()}
});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.in; if(!k) return;
  if(k==='rankCh'){S.rank.ch=t.value;$('#rank-list').innerHTML=rankList()}
  if(k==='fch'){S.filter.challenge=t.value;render()}
  if(k==='status'){const i=I(t.dataset.id);i.status=t.value;render();toast(`${code(i)} moved to ${t.value}`)}
  if(k==='docs'){[...t.files].forEach(f=>S.draftDocs.push({n:f.name,s:size(f.size)}));t.value='';$('#draft-docs').innerHTML=draftDocs()}
  if(k==='photo'){const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{ME().img=r.result;render();if(S.modal)renderModal();toast('Profile photo updated')};r.readAsDataURL(f)}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target,k=f.dataset.f,d=Object.fromEntries(new FormData(f)),id=f.dataset.id;
  if(k==='login'){S.email=(d.email||'').trim();if(!/^[^@\s]+@zb\.co\.zw$/i.test(S.email)){S.err='Use your ZB work email, ending in @zb.co.zw.';render();return}if(!d.pw){S.err='Enter your password.';render();return}S.err='';S.step='verify';render();setTimeout(()=>{const c=$('#lg-code');if(c)c.focus()},30);return}
  if(k==='verify'){if(!/^\d{6}$/.test((d.code||'').trim())){S.err='Enter the 6 digits from the email.';render();return}signIn();return}
  if(k==='comment'){const t=(d.t||'').trim();if(!t)return;I(id).comments.push({u:'me',t,at:Date.now()});S.scrollTo='comments';render();toast('Comment posted');return}
  if(k==='chat'){const t=(d.t||'').trim();if(!t)return;CONVS.find(c=>c.id===id).msgs.push({from:'me',t,at:Date.now()});render();const i=$('.th-form .inp');if(i)i.focus();return}
  if(k==='reply'){const t=(d.t||'').trim();if(!t)return;const n=NOTES.find(x=>x.id===id),to=U[n.from],i=I(n.idea);n.reply=t;
    addEmail({type:'Reply',to:to.email,from:ME().email,subject:`Re: Your idea ${code(i)} has been approved`,body:t});render();toast('Reply sent to '+to.name);return}
  if(k==='newIdea'){
    const title=(d.title||'').trim(),summary=(d.summary||'').trim(),body=(d.body||'').split(/\n\s*\n|\n/).map(s=>s.trim()).filter(Boolean);
    if(!title||!summary){$('#ni-err').textContent='Add a title and a short summary so colleagues know what the idea is.';return}
    const i={id:'i'+Date.now(),num:SEQ++,author:'me',challenge:d.challenge||null,status:d.status||'Idea',created:Date.now(),likes:0,shares:0,liked:false,saved:false,approved:false,title,summary,body:body.length?body:[summary],docs:S.draftDocs.slice(),comments:[]};
    IDEAS.unshift(i);S.draftDocs=[];closeModal(true);go('idea',i.id);toast(`Posted as ${code(i)}`);return}
  if(k==='approve'){approve(id,(d.note||'').trim());closeModal();render();return}
  if(k==='edit'){const me=ME();me.name=(d.name||me.name).trim();me.title=(d.title||'').trim();me.dept=(d.dept||'').trim();me.bio=(d.bio||'').trim();closeModal();render();toast('Profile saved');return}
  if(k==='newChallenge'){const cid='c'+Date.now(),kw=(d.kw||'').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
    CH[cid]={id:cid,title:d.title.trim(),brief:d.brief.trim(),keywords:kw.length?kw:d.title.toLowerCase().split(/\W+/).filter(w=>w.length>3).slice(0,6),deadline:d.deadline?new Date(d.deadline).getTime():Date.now()+30*D,by:'me',posted:Date.now()};
    NOTES.unshift({id:'n'+(NSEQ++),type:'challenge',challenge:cid,from:'me',at:Date.now(),unread:false});
    closeModal(true);go('challenge',cid);toast('Challenge posted to all verified staff');return}
});

render();
})();
</script>

</body></html>
